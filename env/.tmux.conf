set -g default-terminal "xterm-256color"
set-option -sa terminal-features ",xterm-256color:RGB"

set -g mouse on
set -g escape-time 0
set -g focus-events on
set -g history-limit 50000

# OSC 52 clipboard. Copy-mode selections — including those bubbling up from a
# nested remote tmux on a boxy (see gwb's _setup_tmux.sh) — are pushed to the
# macOS clipboard via Ghostty. set-clipboard catches inbound OSC 52 from panes
# and re-emits it to the terminal; the terminal-features flag advertises OSC 52
# support so tmux actually emits it even when terminfo lacks the Ms capability.
set -g set-clipboard on
set -g allow-passthrough on
set -as terminal-features ",xterm-256color:clipboard"

# Session picker sorted by name (default is by activity time), so numeric-
# prefixed primaries (1-main, 2-exploration, 3-investigation) sit at the top.
# -Z opens the picker zoomed; -s limits to sessions (no window tree).
bind s choose-tree -Zs -O name
